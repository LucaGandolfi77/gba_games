<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBA Games</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #a855f7;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .game-card {
      background-color: #16213e;
      border: 1px solid #a855f7;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .game-card h2 {
      font-size: 1rem;
      color: #c084fc;
      margin: 0 0 8px;
    }
    .game-card p {
      font-size: 0.875rem;
      color: #9ca3af;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>GBA Games</h1>
  <div class="games-grid">
    <!-- Game cards will be added here -->
  </div>
</body>
</html>
